[pytest]
# pythonpath puts src/ on sys.path, so tests import the churn package the
# same way the deployed notebooks do. testpaths limits collection to tests/.
pythonpath = src
testpaths = tests-bibi

# Registered markers. -m "not spark" runs the fast loop; a bare pytest runs
# everything. Using an unregistered marker is an error under --strict-markers.
markers =
    spark: needs a local SparkSession (starts a JVM; requires Java 17 or later)

addopts = --strict-markers

# pyspark 3.5 emits deprecation and environment warnings from its own
# imports; none of them is actionable from this project.
filterwarnings =
    ignore::DeprecationWarning:pyspark.sql.pandas.utils
    ignore::DeprecationWarning:pyspark.pandas
    ignore::UserWarning:pyspark.pandas
